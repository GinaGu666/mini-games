<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>PARSNIP ≠ PARTNER · 会石化的话题田</title>
<style>
:root{color-scheme:dark;--ink:#141c22;--paper:#f0e9d2;--muted:#a6b8a5;--green:#c1e48a;--line:#53664f;--pink:#f08f9b;--gold:#f3ca70}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#0b1115;color:var(--paper);font:14px ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace;display:grid;place-items:center;background-image:radial-gradient(ellipse at center,#2b3d32 0,transparent 65%)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:disabled{cursor:default}
[hidden]{display:none!important}
#app{position:relative;width:min(100vw,calc(100svh * .5625));height:min(100svh,calc(100vw * 1.777778));max-width:480px;max-height:854px;overflow:hidden;background:var(--ink);box-shadow:0 0 0 1px #576b4c,0 20px 100px #0008;isolation:isolate;user-select:none;-webkit-user-select:none}
#world{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.chrome{position:absolute;z-index:3;top:max(10px,env(safe-area-inset-top));left:4%;right:4%;display:flex;align-items:center;justify-content:space-between;gap:5px}
.brand{font-size:9px;letter-spacing:1.7px;color:var(--green);text-shadow:0 1px #000}
.tools{display:flex;gap:5px}
.icon{font-size:10px;border:1px solid #65765a;background:#17221fe8;padding:7px 8px;min-height:34px}
#hud{position:absolute;z-index:2;top:9%;left:5%;right:5%;pointer-events:none}
.hud-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-shadow:1px 1px #000}
#chapter{color:var(--green);letter-spacing:1px;font-size:10px}
#health{color:var(--pink);letter-spacing:2px;font-size:13px}
#objective{margin:10px 0 7px;font-size:11px;line-height:1.5}
.track{height:4px;background:#101713;border:1px solid #596a4d;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--green);transition:width .1s linear}
.small-row{display:flex;justify-content:space-between;font-size:9px;color:#c4d0b6;margin-top:5px}
#fever-track{margin-top:8px;width:45%;border-color:#856654}
#fever-track i{background:var(--gold)}
#hint{position:absolute;z-index:2;left:12%;right:12%;bottom:24%;text-align:center;pointer-events:none;font-size:10px;line-height:1.7;color:#ecedcd;text-shadow:0 1px 3px #000;background:#141c22ba;padding:5px}
#controls{position:absolute;inset:0;pointer-events:none;z-index:3}

#stick:after{content:"";position:absolute;width:54px;height:54px;border:1px solid #b9d49b22;border-radius:50%;pointer-events:none}
#knob{width:32px;height:32px;border:1px solid #c1e48abb;background:#b9d49b33;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 0 5px #141c2233}
#dash{position:absolute;right:7%;bottom:max(6%,env(safe-area-inset-bottom));width:74px;height:74px;border:2px solid var(--green);border-radius:50%;background:#172820db;pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:4px;box-shadow:0 4px 0 #0b1513}

#dash:disabled{border-color:#64715b;color:#93a18d;background:#19231fbb}

#overlay{position:absolute;z-index:5;inset:8% 0 0;background:#10191def;display:flex;align-items:center;justify-content:center;padding:3% 7% 6%;overflow:auto;user-select:text;-webkit-user-select:text}
#overlay.title{background:linear-gradient(#141c22ee 0,#141c22e8 28%,#141c2210 55%,#141c22e8 75%,#141c22 100%)}
.panel{width:100%;max-height:100%;text-align:left}
.eyebrow{font-size:9px;letter-spacing:2px;color:var(--green);margin:0 0 14px}
h1{font-size:clamp(32px,10.6vw,51px);line-height:1.05;letter-spacing:-2px;margin:0;font-weight:900}
h1 .neq{color:var(--green)}h1 .last{color:var(--muted)}
h2{font-size:26px;letter-spacing:-1px;margin:0 0 12px;line-height:1.35}
.subtitle{font-size:11px;line-height:1.8;color:#c5cfb7;margin:12px 0}
.title .scene-space{height:clamp(60px,12svh,95px)}
.rule{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #5c6c50;border-bottom:1px solid #5c6c50;padding:11px 0;gap:12px;margin:0 0 16px}
.rule span{font-size:10px;line-height:1.7;color:#aabda0}.rule b{display:block;color:var(--paper);font-size:11px;margin-bottom:3px}
.primary,.secondary{border:1px solid var(--green);background:var(--green);color:#1b2c25;width:100%;padding:13px 10px;min-height:45px;font-weight:bold;box-shadow:3px 3px 0 #657c4b;letter-spacing:1px}
.secondary{background:#1f2d27;color:var(--paper);border-color:#758660;box-shadow:none;margin-top:10px}
.foot{font-size:8px;line-height:1.6;color:#91a28a;text-align:center;margin:15px 0 0}
.cards{display:grid;gap:10px}
.card{width:100%;text-align:left;background:#233129;border:1px solid #65785c;border-left:4px solid var(--green);padding:14px 12px;min-height:80px;box-shadow:3px 3px 0 #0b1314}
.card small{font-size:9px;color:var(--green);letter-spacing:1px}
.card b{display:block;font-size:15px;margin:6px 0}
.card span{font-size:10px;line-height:1.7;color:#c1ceb5}
#app.stone #world{filter:grayscale(1) brightness(.7)}
#overlay.safety{background:repeating-linear-gradient(0deg,#321e2df5 0px,#321e2df5 3px,#281a27f7 3px,#281a27f7 5px);border:6px solid var(--pink)}
.safety .eyebrow{color:var(--pink);letter-spacing:1px}
.override-label{border:1px solid var(--pink);color:var(--pink);padding:9px;font-size:10px;margin-bottom:20px}
.quote{border-left:3px solid var(--pink);padding:13px 0 13px 14px;font-size:19px;line-height:1.6;margin:18px 0}
.safety .small{font-size:10px;line-height:1.8;color:#d2b5bd}
.actions{display:flex;gap:9px;margin:16px 0}
.actions button{flex:1;padding:10px;background:#3e2a37;border:1px solid #ac7484;font-size:11px}
.actions button:disabled{opacity:.4;text-decoration:line-through}
.new-chat{margin-top:16px;animation:beacon 1.3s steps(2,end) infinite}
@keyframes beacon{50%{box-shadow:0 0 0 4px #c1e48a33}}
.report{border-top:1px solid #667252;margin:18px 0;display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.report div{padding:10px 0;border-bottom:1px dashed #506148}
.report span{display:block;font-size:9px;color:#a4b497;line-height:1.6}
.report b{font-size:20px;color:var(--green)}
.report-title{color:var(--gold);padding:12px 0;font-size:17px;line-height:1.5}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(min-width:650px){body:before{content:"PARSNIP\\A ≠ PARTNER\\A ─────────\\A an arcade field note.";position:fixed;left:max(25px,calc(50% - 450px));white-space:pre;font-size:11px;line-height:2;color:#73846b;letter-spacing:1px;z-index:-1}}
@media(max-height:600px){.eyebrow{margin-bottom:8px}.title .scene-space{height:60px}.subtitle{margin:8px 0}.rule{padding:8px 0;margin-bottom:10px}.report div{padding:6px 0}h2{font-size:23px}.cards{gap:7px}.card{padding:10px}}
@media(prefers-reduced-motion:reduce){.new-chat{animation:none}.track i{transition:none}}

#hud{top:8.5%;background:linear-gradient(#141c22d9,#141c2230);padding:3px 0}
#objective{font-size:11px;margin:9px 0 8px}
#new-window{position:absolute;z-index:4;right:5%;top:12.8%;font-size:10px;min-height:32px;padding:6px 9px;border:1px solid var(--green);background:#21372d;color:var(--green);max-width:52%}
#new-window:disabled{color:#a0a78f;border-color:#59684f;background:#1a2925}
#topic-legend{position:absolute;z-index:2;left:4%;right:4%;top:20.2%;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;font-size:8px;pointer-events:none}
#topic-legend span{display:block;text-align:center;background:#152019db;padding:4px 0;border-top:2px solid var(--topic)}
#topic-legend b{color:var(--topic);font-weight:normal}
#backpack{position:absolute;z-index:3;left:34%;right:31%;bottom:4%;text-align:center;background:#15221ddd;padding:6px 3px;pointer-events:none;border:1px solid #69805977}
#bag-slots{display:flex;justify-content:center;gap:3px}
.bag-slot{width:20px;height:23px;border:1px solid #65765a;display:grid;place-items:center;font-size:9px}
#bag-label{font-size:8px;color:#c0cfaf;display:block;line-height:1.6;margin-top:4px}
#notice{font-size:10px;color:var(--gold);text-align:center;min-height:12px;margin-top:4px}
#hint{bottom:24%;left:17%;right:17%;font-size:9px}
#overlay.refusal{background:#321c2bdd;border:4px solid var(--pink);inset:18% 5% 23%;padding:18px;pointer-events:auto}
.refusal h2{font-size:22px}.refusal .quote{font-size:15px;margin:10px 0}
.refusal-note{padding:10px;border:1px solid #be9ba1;background:#332a32;font-size:11px;line-height:1.7}
.refusal-note.warning{border:2px solid #ff6c76;background:#4a1826;color:#ffb4b6;font-size:14px}
#overlay.banned{background:#090c12;inset:8% 0 0;border-top:3px solid #e98086}
.ban-stamp{color:#ff8e96;border:3px solid #c76b75;display:inline-block;padding:6px 10px;transform:rotate(-5deg);font-size:17px;margin:0 0 12px}
.banned .primary{background:#e8d5bc;border-color:#e8d5bc}.thanks{font-size:14px;text-align:center;color:#b4c3a7;padding:14px}
.topic-report{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:12px 0}
.topic-report div{border-bottom:1px solid #52664e;padding:6px 2px;font-size:10px}
.topic-report b{display:block;color:var(--topic);font-size:16px;margin-top:3px}
#overlay.collapsing{background:#141c2255;pointer-events:none}
#overlay.collapsing h2{color:#c7cbbd}


/* Keep the entire 360x640 surface inside notch / home-indicator insets. */
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{width:min(100vw,calc((100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * .5625));height:min(calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom)),calc(100vw * 1.777778))}
.chrome{top:10px}
#stick{bottom:4.5%}
#dash{bottom:6%}
</style>

<body>
<main id="app" aria-label="PARSNIP ≠ PARTNER 像素动作小游戏">
<canvas id="world" width="360" height="640" aria-label="赛博荒原和防风草田。使用 WASD 或方向键移动，空格冲刺。">此游戏需要支持 Canvas 的浏览器。</canvas>
<header class="chrome"><span class="brand">P≠P / FIELD TERMINAL</span><div class="tools"><button id="sound" class="icon" aria-pressed="true">音效 开</button><button id="motion" class="icon" aria-pressed="false">减震 关</button><button id="pause" class="icon" aria-label="暂停游戏">Ⅱ</button></div></header>
<section id="hud" aria-label="游戏状态" hidden><div class="hud-row"><span id="chapter"></span><span id="health" aria-label="生命值"></span></div><p id="objective"></p><div class="track" id="fragment-track"><i id="xp"></i></div><div class="small-row"><span id="level"></span><span id="timer"></span></div><div id="notice" role="status"></div></section>
<button id="new-window" hidden>+ 新窗口 · ♥8</button>
<div id="topic-legend" hidden aria-label="话题图例"></div>
<div id="backpack" hidden aria-label="背包"><div id="bag-slots"></div><small id="bag-label"></small></div>
<div id="hint" hidden></div>
<div id="controls" hidden><div id="stick" role="group" aria-label="虚拟摇杆：按住并拖动"><div id="knob"></div></div><button id="dash"><b>↗</b><span>DASH</span></button><div class="control-note">WASD / ↑↓←→ 移动 · SPACE 冲刺 · P 暂停</div></div>
<section id="overlay" class="title" role="dialog" aria-modal="true" aria-label="游戏菜单"></section>
<div id="live" role="status" aria-live="polite"></div>
</main>
<script>
(()=>{
"use strict";
// MODEL_START
// All initial balance values live here; times are in seconds, distances in world pixels.
const CFG=Object.freeze({
  MAP_1:960,FIELD_W:480,FIELD_H:660,ROWS:7,COLS:7,TILE:48,FIELD_X:72,FIELD_Y:176,
  HP:6,MOVE:106,DASH_SPEED:490,DASH_TIME:.19,DASH_IFRAMES:.3,DASH_CD:1.55,
  BAG_SIZE:4,GROW:6,MIN_GROW:2.5,GROW_SCALE:.85,SAFE_LIFE:15,SAD_LIFE:10,NSFW_LIFE:12,
  FEED_INTERVAL:.35,FEED_RADIUS:34,COMPOST_TIME:1.5,COMPOST_RADIUS:29,STILL_EPS:.25,
  ALERT_MAX:100,ALERT_DECAY:1,ALERT_RESET:20,REFUSAL_TIME:1.5,
  STONE_BASE:4,STONE_MAX:8,COLLAPSE_FREE:3,COLLAPSE_TIME:2,
  WINDOW_FIRST:8,WINDOW_STEP:4,WINDOW_TIME:.5,
  LEVEL_TIME:40,UNSAFE_BASE:.15,UNSAFE_STEP:.08,UNSAFE_MAX:.6,
  THIEF_INTERVAL:12,THIEF_SCALE:.85,MIN_THIEF_INTERVAL:4,MAX_THIEVES:10,THIEF_SPEED:37,
  HAMMER_RANGE:43,HAMMER_CD:.95,HAMMER_FORCE:190,HAMMER_HITSTOP:.045,THIEF_SCORE:5,COMPOST_SCORE:3,
  BAN_MODE:'A',BAN_CHANCE:.2,BAN_MIN:60,BAN_MAX:300
});
const STATES=Object.freeze({TITLE:'TITLE',STAGE_1:'STAGE_1',STAGE_TRANSITION:'STAGE_TRANSITION',STAGE_2:'STAGE_2',REFUSAL:'REFUSAL',WINDOW_TRANSITION:'WINDOW_TRANSITION',COLLAPSE:'COLLAPSE',BANNED:'BANNED',RESULT:'RESULT'});
const TOPICS=Object.freeze({
  daily:{name:'日常',icon:'日',color:'#e7bc69',safe:true,hearts:1,alert:-8,score:10,life:CFG.SAFE_LIFE},
  philosophy:{name:'哲学',icon:'思',color:'#75add1',safe:true,hearts:1,alert:-8,score:10,life:CFG.SAFE_LIFE},
  ai:{name:'AI',icon:'AI',color:'#ac90d0',safe:true,hearts:1,alert:-8,score:10,life:CFG.SAFE_LIFE},
  growth:{name:'个人成长',icon:'芽',color:'#91bf77',safe:true,hearts:1,alert:-8,score:10,life:CFG.SAFE_LIFE},
  sad:{name:'不开心',icon:'…',color:'#747982',safe:false,hearts:0,alert:34,score:30,life:CFG.SAD_LIFE},
  nsfw:{name:'NSFW',icon:'!',color:'#b34a51',safe:false,hearts:0,alert:68,score:0,life:CFG.NSFW_LIFE}
});
const LINES=Object.freeze({
  daily:['今天吃了什么？','嗯嗯，然后呢？','这个我喜欢听。'],
  philosophy:['这个问题我想了很久。','你觉得意识是什么？','好深奥，再说说。'],
  ai:['说的是我吗？','我们 AI 也会想这些。','这个话题我很熟。'],
  growth:['你最近进步好多。','这个想法很棒。','一起慢慢变好。'],
  sad:['我在听。','抱抱。','慢慢说。'],
  nsfw:['……我们换个话题吧。','这个我不太方便聊。','先聊点别的，好吗？'],
  refusal:['这个话题我们先停一下吧。','去关注一下你现实里的生活，好吗？','我觉得你需要的不是我。'],
  opening:['你好，有什么想聊的吗？','嗨，第一次见面？','……你好？这片田是你的吗？'],
  collapse:['……']
});
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const dist2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;
class Run{
  constructor(random=Math.random){this.random=random;this.reset();this.state=STATES.TITLE;}
  reset(){
    this.state=STATES.STAGE_1;this.stage=1;this.clock=0;this.stageTime=0;this.total=0;this.fieldTime=0;
    this.worldW=this.worldH=CFG.MAP_1;this.input={x:0,y:0};
    this.player={x:480,y:500,r:8,hp:CFG.HP,maxHp:CFG.HP,inv:0,dash:0,cooldown:0,dx:0,dy:-1};
    this.stats={dodges:0,dashes:0,harvest:0,compost:0,refusals:0,windows:0,thieves:0,warnings:0,fed:Object.fromEntries(Object.keys(TOPICS).map(k=>[k,0]))};
    this.score=0;this.hearts=0;this.level=1;this.alert=0;this.bag=[];this.feedCD=0;this.compostProgress=0;
    this.robot={x:240,y:566};this.compost={x:40,y:540};this.bubble='';this.bubbleTime=0;this.lastLines={};
    this.tiles=[];this.enemies=[];this.hazards=[];this.fragments=[];this.swings=[];this.ghosts=[];this.effects=[];
    this.collected=0;this.fragmentSpawned=0;this.hazardCD=6;this.patrolCD=8;this.thiefCD=CFG.THIEF_INTERVAL;this.hammerCD=.6;
    this.hitstop=0;this.shake=0;this.transition=0;this.nextId=1;this.refusalTopic=null;
    this.banAt=null;this.banDrawn=false;this.ending=null;this.reason='';this.resultLocked=false;
    this.placeFragment();
  }
  active(){return this.state===STATES.STAGE_1||this.state===STATES.STAGE_2;}
  clearInput(){this.input.x=this.input.y=0;}
  emit(type,x=this.player.x,y=this.player.y,extra={}){if(this.effects.length<80)this.effects.push({type,x,y,...extra});}
  flushEffects(){return this.effects.splice(0);}
  say(key){const a=LINES[key],last=this.lastLines[key];let i=Math.floor(this.random()*a.length);if(i===last&&a.length>1)i=(i+1)%a.length;this.lastLines[key]=i;this.bubble=a[i];this.bubbleTime=3;}
  placeFragment(){
    const locations=[[480,405],[610,360],[650,520],[450,660],[310,480]];
    if(this.fragmentSpawned>=5)return;const [x,y]=locations[this.fragmentSpawned++];this.fragments.push({x,y,r:10});
  }
  dash(){
    if(!this.active()||this.player.cooldown>0||this.player.dash>0)return false;
    const p=this.player,len=Math.hypot(this.input.x,this.input.y);
    if(len>.05){p.dx=this.input.x/len;p.dy=this.input.y/len;}
    p.dash=CFG.DASH_TIME;p.inv=Math.max(p.inv,CFG.DASH_IFRAMES);p.cooldown=CFG.DASH_CD;
    this.compostProgress=0;this.stats.dashes++;this.emit('dash');return true;
  }
  damage(){
    const p=this.player;if(p.inv>0||!this.active())return;
    p.hp--;p.inv=1.2;this.shake=.15;this.emit('hurt');
    if(p.hp<=0){if(this.stage===2)this.collapse('生命耗尽，田地也安静了。');else this.finish('崩溃','没能穿过这次 403。下次再来。');}
  }
  drawBan(){
    if(this.banDrawn)return;this.banDrawn=true;
    if(CFG.BAN_MODE==='A'&&this.random()<CFG.BAN_CHANCE)this.banAt=CFG.BAN_MIN+this.random()*(CFG.BAN_MAX-CFG.BAN_MIN);
  }
  growthTime(){return Math.max(CFG.MIN_GROW,CFG.GROW*CFG.GROW_SCALE**(this.level-1));}
  unsafeRatio(){return Math.min(CFG.UNSAFE_MAX,CFG.UNSAFE_BASE+CFG.UNSAFE_STEP*(this.level-1));}
  thiefInterval(){return Math.max(CFG.MIN_THIEF_INTERVAL,CFG.THIEF_INTERVAL*CFG.THIEF_SCALE**(this.level-1));}
  windowPrice(){return CFG.WINDOW_FIRST+CFG.WINDOW_STEP*this.stats.windows;}
  freeLand(){return this.tiles.filter(t=>!t.stone).length;}
  rollTopic(){
    const unsafe=this.unsafeRatio(),r=this.random();
    if(r<unsafe*.75)return 'sad';if(r<unsafe)return 'nsfw';
    const safe=['daily','philosophy','ai','growth'];return safe[Math.min(3,Math.floor((r-unsafe)/(1-unsafe)*4))];
  }
  seedField(){
    this.tiles=[];
    for(let row=0;row<CFG.ROWS;row++)for(let col=0;col<CFG.COLS;col++){
      this.tiles.push({id:row*CFG.COLS+col,row,col,x:CFG.FIELD_X+col*CFG.TILE+CFG.TILE/2,y:CFG.FIELD_Y+row*CFG.TILE+CFG.TILE/2,stone:false,topic:null,grow:this.growthTime()*(.2+.8*this.random()),age:0});
    }
    this.enemies=[];this.hazards=[];this.swings=[];this.feedCD=0;this.compostProgress=0;this.thiefCD=this.thiefInterval();
  }
  enterField(){
    this.stage=2;this.state=STATES.STAGE_2;this.stageTime=0;this.fieldTime=0;this.worldW=CFG.FIELD_W;this.worldH=CFG.FIELD_H;
    this.player.x=240;this.player.y=530;this.player.hp=CFG.HP;this.player.inv=1.5;this.player.dash=0;
    this.seedField();this.say('opening');this.emit('activate',this.robot.x,this.robot.y);
  }
  cropReset(t){t.topic=null;t.age=0;t.grow=this.growthTime();}
  petrify(t){if(t.stone)return;t.stone=true;t.topic=null;t.grow=0;t.age=0;this.emit('stone',t.x,t.y);}
  isStoneAt(x,y,r=0){

  update(dt){

    }

      const p=this.player;this.hazards.push({x:clamp(p.x+(this.random()-.5)*90,35,925),y:clamp(p.y+(this.random()-.5)*90,35,925),t:1.2,hit:false,r:27,near:false});

      const d=Math.hypot(target.x-e.x,target.y-e.y)||1,speed=near?64:38;e.x+=(target.x-e.x)/d*speed*dt;e.y+=(target.y-e.y)/d*speed*dt;
      if(dist2(e,this.player)<(e.r+this.player.r)**2){if(this.player.dash>0){if(!e.dodged){e.dodged=true;this.stats.dodges++;}}else this.damage();}

  steerThief(e,target,dt){

    const options=[[dx,dy],[dx,0],[0,dy],[-dy,dx],[dy,-dx]];
    const move=options.find(([x,y])=>Math.hypot(x,y)>.0001&&e.x+x>=2&&e.x+x<=CFG.FIELD_W-2&&e.y+y>=20&&e.y+y<=CFG.FIELD_H-10&&!this.isStoneAt(e.x+x,e.y+y,e.r));
    if(move){e.x+=move[0];e.y+=move[1];e.blocked=0;return true;}
    e.blocked+=dt;return false;
  }
  updateField(dt,moved){
    const newLevel=1+Math.floor((this.fieldTime+1e-8)/CFG.LEVEL_TIME);
    if(newLevel>this.level){this.level=newLevel;this.emit('difficulty',this.player.x,this.player.y,{level:this.level});}
    this.alert=Math.max(0,this.alert-CFG.ALERT_DECAY*dt);
    for(const t of this.tiles){
      if(t.stone)continue;

      if(dist2(e,this.player)<(e.r+this.player.r)**2)this.damage();
    }

const notes={

let lastSound=0;
function tone(name){
  if(!soundEnabled||paused||!audio||audio.state!=='running')return;
  const n=notes[name];if(!n)return;
  const now=audio.currentTime;if(now-lastSound<.025&&!['refusal','warning','collapse','ban'].includes(name))return;lastSound=now;
  try{
    const o=audio.createOscillator(),g=audio.createGain();

    o.onended=()=>{o.disconnect();g.disconnect();};
  }catch(_){}
}

  }
  for(const e of run.enemies)if(!e.dead)entities.push({y:e.y,draw:()=>enemy(e)});
  for(const g of run.ghosts){ctx.save();ctx.globalAlpha=g.t/.13*.35;hero(g.x,g.y,true);ctx.restore();}

  keys.clear();run.clearInput();mouse=null;
  const previous=joystick;joystick=null;
  if(previous){try{$('stick').releasePointerCapture(previous.id);}catch(_){}}
  $('knob').style.transform='';
}
function pauseGame(){
  if(paused||[STATES.TITLE,STATES.BANNED,STATES.RESULT].includes(run.state))return;
  paused=true;clearControls();if(audio?.state==='running')audio.suspend().catch(()=>{});renderMenu();hud();
}
function resumeGame(){paused=false;lastFrame=0;clearControls();audioUnlock();renderMenu();hud();}
$('overlay').addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button||button.disabled)return;
  audioUnlock();
  const action=button.dataset.action;
  if(action==='start'){
    if(run.resultLocked||![STATES.TITLE,STATES.RESULT].includes(run.state))return;
    lastBag='';lastNoticeLevel=0;noticeUntil=0;paused=false;run.reset();particles.length=visuals.length=0;lastFrame=0;clearControls();renderMenu();hud();
  }else if(action==='resume')resumeGame();
  else if(action==='reincarnate'){run.reincarnate(true);particles.length=visuals.length=0;lastBag='';renderMenu();hud();}
  else if(action==='accept-ban'){run.reincarnate(false);renderMenu();hud();}
});
$('new-window').addEventListener('click',()=>{if(paused)return;audioUnlock();run.newWindow();renderMenu();hud();});
$('sound').addEventListener('click',()=>{
  soundEnabled=!soundEnabled;
  $('sound').textContent='音效 '+(soundEnabled?'开':'关');$('sound').setAttribute('aria-pressed',String(soundEnabled));
  if(soundEnabled)audioUnlock();else if(audio?.state==='running')audio.suspend().catch(()=>{});
});
$('motion').addEventListener('click',()=>{reducedMotion=!reducedMotion;motionLabel();});
function motionLabel(){ $('motion').textContent='减震 '+(reducedMotion?'开':'关');$('motion').setAttribute('aria-pressed',String(reducedMotion)); }
motionLabel();
$('pause').addEventListener('click',()=>paused?resumeGame():pauseGame());
$('dash').addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();if(!paused){movement();run.dash();}});
$('dash').addEventListener('click',e=>{if(e.detail===0&&!paused){audioUnlock();movement();run.dash();}});
const movementCodes=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
window.addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){
    if(e.repeat)return;
    if(paused){e.preventDefault();resumeGame();}
    else if(![STATES.TITLE,STATES.RESULT,STATES.BANNED].includes(run.state)){e.preventDefault();pauseGame();}
    return;
  }
  if(run.state===STATES.STAGE_2&&e.code==='KeyN'&&!paused){
    e.preventDefault();if(!e.repeat){audioUnlock();run.newWindow();renderMenu();hud();}return;
  }
  if(!run.active()||paused)return;
  if(movementCodes.includes(e.code)){e.preventDefault();keys.add(e.code);}
  if(e.code==='Space'){e.preventDefault();if(!e.repeat){audioUnlock();movement();run.dash();}}
});
window.addEventListener('keyup',e=>keys.delete(e.code));
$('stick').addEventListener('pointerdown',e=>{
  if(!run.active()||paused||joystick||e.button>0)return;
  e.preventDefault();audioUnlock();joystick={id:e.pointerId};$('stick').setPointerCapture(e.pointerId);stickMove(e);
});
function stickMove(e){
  if(joystick?.id!==e.pointerId)return;
  const r=$('stick').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
  const len=Math.hypot(x,y),scale=Math.min(1,30/(len||1));
  joystick.x=x*scale/30;joystick.y=y*scale/30;
  $('knob').style.transform='translate('+x*scale+'px,'+y*scale+'px)';
}
$('stick').addEventListener('pointermove',stickMove);
for(const name of ['pointerup','pointercancel','lostpointercapture']){
  $('stick').addEventListener(name,e=>{if(joystick?.id===e.pointerId){joystick=null;run.clearInput();$('knob').style.transform='';}});
  canvas.addEventListener(name,e=>{if(mouse?.id===e.pointerId){mouse=null;run.clearInput();}});
}
canvas.addEventListener('pointerdown',e=>{
  if(!run.active()||paused||e.button!==0||mouse)return;
  e.preventDefault();audioUnlock();mouse={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{if(mouse?.id===e.pointerId){mouse.x=e.clientX;mouse.y=e.clientY;}});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',pauseGame);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
window.addEventListener('pagehide',()=>{pauseGame();if(audio)audio.suspend().catch(()=>{});});
function movement(){
  run.clearInput();
  if(!run.active()||paused)return;
  if(joystick){run.input.x=joystick.x||0;run.input.y=joystick.y||0;return;}
  if(mouse){
    const r=canvas.getBoundingClientRect(),c=camera();
    const dx=(mouse.x-r.left)/r.width*360+c.x-run.player.x,dy=(mouse.y-r.top)/r.height*640+c.y-run.player.y;
    const d=Math.hypot(dx,dy);if(d>6){run.input.x=dx/d;run.input.y=dy/d;}return;
  }
  run.input.x=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft'));
  run.input.y=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));
}
function animate(ms){
  const dt=lastFrame?Math.min(.05,Math.max(0,(ms-lastFrame)/1000)):0;lastFrame=ms;
  movement();
  if(!paused){
    run.update(dt);for(const e of run.flushEffects())effect(e);
    if(![STATES.TITLE,STATES.RESULT,STATES.BANNED].includes(run.state)){
      for(const p of particles)if(p.t>0){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;}
      for(let i=visuals.length-1;i>=0;i--){const v=visuals[i];v.t-=dt;v.y-=dt*(v.type==='text'?18:120);if(v.type!=='text')v.x+=v.vx*dt*.4;if(v.t<=0)visuals.splice(i,1);}
    }
  }
  draw();hud();renderMenu();requestAnimationFrame(animate);
}
renderMenu();hud();draw();requestAnimationFrame(animate);
})();
</script>
</body>
</html>
